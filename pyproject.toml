[project]
name = "django-shop-prod"
version = "0.1.0"
description = "Django shop project"
authors = [{name = "Pavel Bogaenko", email = "bogaenkopavel@yandex.ru"}]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=4.2,<5.0)",
    "djangorestframework (>=3.14,<4.0)",
    "django-filter (>=22.1,<23.0)",
    "pillow (>=10.1,<11.0)",
    "gunicorn (>=26.2,<27.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = ">=4.0,<5.0"
