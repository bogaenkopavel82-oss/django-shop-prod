version: '3.8'

services:
  web:
    build: .
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log --pythonpath /app/mysite mysite.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./mysite:/app/mysite
      - ./logs:/app/logs
      - ./media:/app/media
      - ./static:/app/static
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
